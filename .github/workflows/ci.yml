name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  schedule:
    - cron: '17 6 * * 1'  # weekly whatsmeow upgrade probe

# Supersede in-flight runs when a branch gets a newer push; never cancel main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: go mod download
      - name: gofmt
        run: |
          diff=$(gofmt -l .)
          if [ -n "$diff" ]; then
            echo "gofmt differences:"
            echo "$diff"
            gofmt -d .
            exit 1
          fi
      - run: go vet ./...
      - run: go test -race -coverprofile=cover.out ./...
      - run: go tool cover -func=cover.out | tail -1
      - run: go build ./...
      - name: mdtest parity grep
        # Fails if a whatsmeow method we call disappears upstream — an early
        # signal that the API was removed or renamed.
        run: bash ./scripts/mdtest-parity.sh

  upgrade-check:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Record pinned version
        run: echo "OLD_PIN=$(go list -m -f '{{.Version}}' go.mau.fi/whatsmeow)" >> "$GITHUB_ENV"
      - run: go get go.mau.fi/whatsmeow@main
      - run: go mod tidy
      - name: Record upstream version
        run: echo "NEW_PIN=$(go list -m -f '{{.Version}}' go.mau.fi/whatsmeow)" >> "$GITHUB_ENV"
      - run: go build ./...
      - run: go test ./...
      - name: Record build/test status
        if: always()
        run: echo "STATUS=${{ job.status }}" >> "$GITHUB_ENV"
      - name: Report bump to rolling issue
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "${OLD_PIN:-}" ] || [ -z "${NEW_PIN:-}" ]; then
            echo "version check did not complete; skipping report"
            exit 0
          fi
          if [ "$OLD_PIN" = "$NEW_PIN" ]; then
            echo "whatsmeow already current, nothing to report"
            exit 0
          fi
          body="whatsmeow can be bumped.

          - Current pin: \`$OLD_PIN\`
          - Upstream @main: \`$NEW_PIN\`
          - Build and test against @main: $STATUS

          Run \`go get go.mau.fi/whatsmeow@main && go mod tidy\` to accept."
          num=$(gh issue list --label upstream --state open --limit 1 --json number -q '.[0].number')
          if [ -n "$num" ]; then
            gh issue edit "$num" --body "$body"
          else
            gh issue create --title "whatsmeow upstream update available" --label upstream --body "$body"
          fi

  build-binaries:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
          - os: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
          - os: macos-15
            goos: darwin
            goarch: amd64
          - os: macos-15
            goos: darwin
            goarch: arm64
          - os: windows-latest
            goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      # go-sqlite3 needs cgo. CGO_ENABLED=0 compiles but dies at runtime with
      # "sqlite3 requires cgo to work", so build on the target OS with its
      # native C compiler rather than cross-compiling.
      - name: Install MinGW (Windows)
        if: matrix.goos == 'windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc
      - name: Build binary
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF#refs/tags/v}"
          ext=""
          [[ "${{ matrix.goos }}" == "windows" ]] && ext=".exe"
          export CGO_ENABLED=1
          case "${{ matrix.goos }}" in
            windows)
              export PATH="/c/msys64/mingw64/bin:$PATH"
              export CC=x86_64-w64-mingw32-gcc
              ;;
            darwin)
              # Xcode's SDK is universal. Go passes the target -arch to clang
              # itself; setting one here too makes clang reject -E output.
              export CC=clang
              ;;
          esac
          go build -trimpath -ldflags "-s -w -X main.Version=${VERSION}" \
            -o "whatsapp-mcp_${VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}${ext}" \
            ./cmd/whatsapp-mcp
      - name: Smoke test (linux/amd64)
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: ./whatsapp-mcp_${GITHUB_REF#refs/tags/v}_linux_amd64 -store "$RUNNER_TEMP/smoke-store" smoke
      - uses: actions/upload-artifact@v4
        with:
          name: whatsapp-mcp-${{ matrix.goos }}-${{ matrix.goarch }}
          path: whatsapp-mcp_*
          if-no-files-found: error

  build-mcpb:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: build-binaries
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: bins
          merge-multiple: true
      - name: Build MCPB bundles
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF#refs/tags/v}"
          mkdir -p bundles
          for target in linux_amd64 linux_arm64 darwin_amd64 darwin_arm64 windows_amd64; do
            ext=""
            [[ "$target" == windows_* ]] && ext=".exe"
            staging="stage-$target"
            mkdir -p "$staging/server"
            cp "bins/whatsapp-mcp_${VERSION}_${target}${ext}" "$staging/server/whatsapp-mcp${ext}"
            cp mcpb/manifest.json mcpb/icon.png "$staging/"
            sed -i "s/\"version\": \"0.0.0\"/\"version\": \"${VERSION}\"/" "$staging/manifest.json"
            (cd "$staging" && zip -qr "../bundles/whatsapp-mcp_${VERSION}_${target}.mcpb" .)
          done
      - uses: actions/upload-artifact@v4
        with:
          name: mcpb-bundles
          path: bundles/*.mcpb
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [test, build-mcpb]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > checksums.txt
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
